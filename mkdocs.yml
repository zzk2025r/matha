# Matha Documentation Configuration
site_name: Matha
site_description: 自举式领域专用语言与独立可执行编程语言系统
site_url: https://matha.readthedocs.io/
site_author: Matha Team
repo_url: https://github.com/zzk2025r/matha
repo_name: zzk2025r/matha
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2024-2026 Matha Team

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  font:
    text: Noto Sans SC
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

nav:
  - 首页: index.md
  - 快速开始:
    - 安装指南: getting-started/installation.md
  - API 参考:
    - 依赖层: api/deps.md
  - 版本历史:
    - 更新日志: ../CHANGELOG.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search:
      lang: zh
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            docstring_style: google
            merge_init_into_class: true
            separate_signature: true
            filters: ["!^_"]
  - git-revision-date-localized:
      type: date
      locale: zh
  - minify:
      minify_html: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/zzk2025r/matha
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/matha/
  alternate:
    - name: English
      link: /en/
      lang: en
  version:
    provider: mike

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn