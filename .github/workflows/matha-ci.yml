# Matha 核心项目 CI/CD Pipeline
# 自动化测试 → 代码质量检查 → 性能基准 → 构建发布

name: Matha CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHONIOENCODING: "utf-8"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHON_VERSION: "3.11"

jobs:
  # ============================================================
  # 1. 代码质量检查 (Lint & Format)
  # ============================================================
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install linting tools
        run: |
          pip install -q black ruff mypy

      - name: Check Python version
        run: python --version

      - name: Black format check (advisory, non-blocking)
        continue-on-error: true
        run: |
          black --check src/ tests/ || (
            echo "::warning::代码格式不合规（非阻断项，真实门禁为 scripts/check.py），请运行: black src/ tests/"
          )

      - name: Ruff linter
        run: |
          ruff check src/ tests/ || true

      - name: Mypy type check (non-blocking for now)
        run: |
          mypy src/deps.py --ignore-missing-imports || true
        # TODO: 启用完整 mypy 检查当类型注解完整后

  # ============================================================
  # 2. 单元测试矩阵 (多 Python 版本 / 多 OS)
  # ============================================================
  test:
    name: Unit Tests (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install package with all optional dependencies
        run: |
          pip install -e ".[all]"

      - name: Run quality gate (scripts/check.py)
        run: |
          python scripts/check.py

      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            .coverage
            htmlcov/
          retention-days: 7

  # ============================================================
  # 3. 性能基准测试
  # ============================================================
  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install package with performance deps
        run: |
          pip install -e ".[performance,dev]"

      - name: Run interpreter benchmark
        run: |
          python -c "
          from src.vm import benchmark, CrossVerifier
          import time

          # 简单算术基准
          result = benchmark('#1：[1 + 2 * 3 + 4 * 5]')
          print(f'Interpreter: {result[\"interpreter_ms\"]:.0f}ms, VM: {result[\"vm_ms\"]:.0f}ms, Speedup: {result[\"speedup\"]:.1f}x')

          # 交叉验证
          verifier = CrossVerifier(verbose=True)
          verifier.verify('#1：[sin(3.14159)]')
          verifier.verify('#1：[fib(10)]')
          print(verifier.get_summary())
          "

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: |
            benchmark_*.json
            docs/benchmark_*.md
          retention-days: 30

  # ============================================================
  # 4. 构建独立可执行文件
  # ============================================================
  build-exe:
    name: Build Executables
    runs-on: windows-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build matha.exe
        run: |
          python -m PyInstaller --noconfirm matha.spec
          ls -la dist/matha-offline/matha.exe

      - name: Build matha-cc.exe
        run: |
          python -m PyInstaller --noconfirm matha-cc.spec
          ls -la dist/matha-cc-offline/matha-cc.exe

      - name: Test executables
        run: |
          dist\matha-offline\matha.exe --version
          dist\matha-cc-offline\matha-cc.exe info

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: matha-executables-${{ github.sha }}
          path: |
            dist/matha-offline/matha.exe
            dist/matha-cc-offline/matha-cc.exe
          retention-days: 30

  # ============================================================
  # 5. 离线部署验证
  # ============================================================
  offline-verify:
    name: Offline Deployment Verify
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Create offline package
        run: |
          pip install -e .
          python scripts/package_offline.py --output-dir offline_pkg

      - name: Verify offline package
        run: |
          python scripts/verify_offline.py --package-dir offline_pkg --quick

      - name: Upload offline package
        uses: actions/upload-artifact@v4
        with:
          name: matha-offline-package
          path: offline_pkg/
          retention-days: 7

  # ============================================================
  # 6. 发布到 PyPI (仅 tag 触发)
  # ============================================================
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [lint, test, build-exe]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: |
          python -m build
          ls -la dist/

      - name: Verify package
        run: |
          twine check dist/*

      - name: Publish to PyPI
        run: |
          twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

      - name: Generate release notes
        run: |
          python scripts/generate_release_notes.py > RELEASE_NOTES_${GITHUB_REF_NAME}.md
          cat RELEASE_NOTES_${GITHUB_REF_NAME}.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/matha-offline/matha.exe
            dist/matha-cc-offline/matha-cc.exe
          body_path: RELEASE_NOTES_${GITHUB_REF_NAME}.md
          draft: false
          prerelease: false

  # ============================================================
  # 7. 通知
  # ============================================================
  notify:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: always()
    steps:
      - name: Determine status
        id: status
        run: |
          if [[ "${{ needs.lint.result }}" == "success" && "${{ needs.test.result }}" == "success" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi

      - name: Notify success
        if: steps.status.outputs.status == 'success'
        run: |
          echo "✅ Matha CI 成功完成"
          echo "版本: ${{ github.ref_name }}"
          echo "提交: ${{ github.sha }}"
          # 可集成钉钉/Slack/邮件通知

      - name: Notify failure
        if: steps.status.outputs.status == 'failure'
        run: |
          echo "❌ Matha CI 失败"
          echo "版本: ${{ github.ref_name }}"
          echo "提交: ${{ github.sha }}"
          exit 1