# DORMANT(ci-hygiene): 不再参与 push 门禁（已移除 push.branches/tags），仅保留
# 手动触发。原因：仓库当前 secrets 与 variables 均为 0，DOCKER_USERNAME /
# DOCKER_PASSWORD 永远为空，docker/login-action 直接报 "Username and password
# required"（近 20 次 run 全部 failure，其中 19 次由 main push 触发）；REGISTRY
# 仍为占位域名 docker.your-company.com。待真实镜像仓与凭据就绪后再恢复触发。
name: Build & Push Docker Image

on:
  workflow_dispatch:

env:
  REGISTRY: docker.your-company.com
  IMAGE_NAME: matha-auth

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./packages
          file: ./packages/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache,mode=max
