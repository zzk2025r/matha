# ci-hygiene: 仅 tag + 手动触发，不参与 push.branches / pull_request 门禁。
# 阶段 25e 去外部凭据：原 PyPI 私有源（占位域名 + PYPI_TOKEN，仓库无法配置）
# 已删除；发行物改为 GitHub Release 附件——凭据仅 actions 自动注入的
# GITHUB_TOKEN（零用户 secrets）。附件可由 `matha app import-release` 导入
# 本地应用中心（阶段 25d）。
name: Attach matha-auth package to Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  attach:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Release 创建与附件上传

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build package
        run: |
          cd packages
          python -m build
          twine check dist/*

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --generate-notes

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" packages/dist/* --clobber
