# ci-hygiene: 仅 tag + 手动触发，不参与 push.branches / pull_request 门禁。已知
# 未满足的前置：仓库 secrets 总数为 0，TWINE_PASSWORD 引用的 PYPI_TOKEN 为空，
# 且 TWINE_REPOSITORY_URL 仍是占位域名 pypi.your-company.com（近 1 次 tag 触发
# 已因此 failure）。真实发布通道建立后再启用。
name: Publish matha-auth to PyPI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # PyPI trusted publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build package
        run: |
          cd packages
          python -m build

      - name: Publish to PyPI (private)
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
          TWINE_REPOSITORY_URL: https://pypi.your-company.com/simple/
        run: |
          twine upload packages/dist/*
