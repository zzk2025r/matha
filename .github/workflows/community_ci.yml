name: Matha CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install -e .
      - name: Run tests
        run: python test_full.py
      - name: Syntax check
        run: python -m py_compile src/**/*.py
      - name: Lint
        run: python -m py_compile src/domains/*.py src/*.py
