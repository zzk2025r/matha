# Matha Multi-Language Benchmark
# 多语言性能基准测试 — Matha vs C++ vs Rust vs Go vs Java
# 在 push/PR 到 main 时自动运行，并生成性能报告

name: MultiLang Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'  # 每周一 UTC 02:00

env:
  PYTHONIOENCODING: "utf-8"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ── 1. Python 单元测试 ─────────────────────────────────────────────────────
  test:
    name: 单元测试 (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 运行多语言增强测试
        run: |
          python -m unittest tests.test_multilang_enhancement -v

      - name: 运行完整测试套件
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

  # ── 2. Rust 性能基准测试 ───────────────────────────────────────────────────
  bench-rust:
    name: Rust 性能基准
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: 安装 Python 依赖
        run: pip install -r requirements.txt 2>/dev/null || true

      - name: 运行 Matha vs Rust 基准测试
        run: |
          python scripts/benchmark_rust.py --lang all --output docs/benchmark_rust_report.md

      - name: 上传基准测试结果
        uses: actions/upload-artifact@v4
        with:
          name: rust-benchmark-data
          path: |
            docs/benchmark_rust_report.md
            _bench_result.json
          retention-days: 30

  # ── 3. 性能报告生成 ────────────────────────────────────────────────────────
  report:
    name: 生成性能报告
    runs-on: ubuntu-latest
    needs: [test, bench-rust]
    if: success() || failure()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 下载基准测试数据
        uses: actions/download-artifact@v4
        with:
          name: rust-benchmark-data
          path: docs/

      - name: 生成性能差距分析
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime

          with open("_bench_result.json") as f:
              data = json.load(f)

          lines = [
              "# Matha vs Rust 性能差距分析报告",
              "",
              f"**生成时间**: {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}",
              f"**Git SHA**: {os.popen('git rev-parse --short HEAD').read().strip()}",
              f"**环境**: {data['metadata'].get('platform', 'linux')} / Python {data['metadata'].get('python', '3.x')}",
              "",
              "## 测试结果汇总",
              "",
              "| 算法 | 语言 | 耗时(ms) | 最小 | 最大 | 状态 |",
              "|------|------|----------|------|------|------|",
          ]

          for e in data["entries"]:
              status = "OK" if not e["error"] else f"ERR: {e['error'][:30]}"
              lines.append(
                  f"| {e['test_name']} | {e['language']} | "
                  f"{e['avg_ms']:.2f} | {e['min_ms']:.2f} | {e['max_ms']:.2f} | {status} |"
              )

          # 性能差距分析
          entries_by_test = {}
          for e in data["entries"]:
              entries_by_test.setdefault(e["test_name"], {})[e["language"]] = e

          lines.append("")
          lines.append("## 性能差距分析")
          lines.append("")
          lines.append("| 算法 | Matha (ms) | Rust (ms) | 加速比 | 分析 |")
          lines.append("|------|-----------|-----------|--------|------|")

          for test_name, langs in entries_by_test.items():
              matha = langs.get("matha", {})
              rust = langs.get("rust", {})
              if not matha or not rust or matha.get("error") or rust.get("error"):
                  continue
              m = matha["avg_ms"]
              r = rust["avg_ms"]
              if r > 0:
                  speedup = m / r
                  if speedup > 50:
                      analysis = "Rust 显著更快 (编译期优化)"
                  elif speedup > 10:
                      analysis = "Rust 明显更快"
                  elif speedup > 3:
                      analysis = "Rust 较快"
                  else:
                      analysis = "差距较小"
                  lines.append(f"| {test_name} | {m:.2f} | {r:.2f} | {speedup:.1f}x | {analysis} |")
              else:
                  lines.append(f"| {test_name} | {m:.2f} | N/A | — | Rust 基准失败 |")

          lines.append("")
          lines.append("## 结论与建议")
          lines.append("")
          lines.append("### 性能差距原因")
          lines.append("")
          lines.append("1. **解释器开销**: Matha 基于 Python 解释器，每次执行需经过词法分析→语法分析→解释执行")
          lines.append("2. **类型系统**: Rust 编译期类型检查 + 零成本抽象，无需运行时类型分发")
          lines.append("3. **内存布局**: Rust 值语义 + 栈分配，Python 对象语义 + 堆分配 + 引用计数")
          lines.append("4. **JIT/AOT**: Rust 原生编译 (-O 优化)，Matha 可生成 Rust/C++ 代码实现同等性能")
          lines.append("")
          lines.append("### 优化建议")
          lines.append("")
          lines.append("1. **数学密集型计算**: 使用 `generate_rust()` 生成 Rust 代码并编译执行")
          lines.append("2. **系统级应用**: 通过 MultiLangVerifier 验证后替换为 Rust 实现")
          lines.append("3. **并发计算**: 使用 CSP ProcessPool 实现进程级并行（绕过 GIL）")
          lines.append("4. **LLVM 后端**: 规划中的 v3.0 将直接生成 LLVM IR，接近原生性能")
          lines.append("")
          lines.append("---")
          lines.append("*本报告由 Matha 多语言基准测试框架自动生成*")

          report = "\n".join(lines)
          with open("docs/performance_gap_analysis.md", "w", encoding="utf-8") as f:
              f.write(report)
          print("性能差距分析报告已生成: docs/performance_gap_analysis.md")
          print(report)
          PY

      - name: 上传分析报告
        uses: actions/upload-artifact@v4
        with:
          name: performance-analysis
          path: docs/performance_gap_analysis.md
          retention-days: 30
