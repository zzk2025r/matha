name: Matha Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 4.3.1)'
        required: true
        default: '4.3.0'
      environment:
        description: '发布环境'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - dev
      dry_run:
        description: '预览模式（不实际发布）'
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'
  MATHA_VERSION: ${{ github.event.inputs.version || github.ref_name }}
  MATHA_ENV: ${{ github.event.inputs.environment || 'production' }}
  MATHA_DRY_RUN: ${{ github.event.inputs.dry_run || false }}

jobs:
  # ============================================================
  # 1. 构建与测试
  # ============================================================
  build-and-test:
    name: 构建与测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-benchmark -q

      - name: 运行单元测试
        run: |
          python -m unittest discover -s tests -v

      - name: 运行压力测试
        run: |
          python tests/stress_test_10khz.py --frequency 10000 --duration 5

      - name: 运行 Jupyter 测试
        run: |
          python tests/test_jupyter_magic.py -v

      - name: 运行依赖解析测试
        run: |
          python tests/test_pkg_manager_dependency.py

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            *.log
            tests/test_*.xml
          retention-days: 30

  # ============================================================
  # 2. 代码质量检查
  # ============================================================
  quality-check:
    name: 代码质量检查
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 运行预检脚本
        run: |
          python preflight_check.py

      - name: 运行文件检查
        run: |
          python check_files.py

      - name: 运行 Git 检查
        run: |
          python check_git.py

  # ============================================================
  # 3. 创建 Release
  # ============================================================
  create-release:
    name: 创建 Release
    runs-on: ubuntu-latest
    needs: [build-and-test, quality-check]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装 gh CLI
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
        run: npm install -g @github/cli

      - name: 登录 GitHub
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: 检查环境
        run: |
          python install_tools.py --verify

      - name: 创建 Git 标签
        run: |
          git tag -a ${{ env.MATHA_VERSION }} -m "Matha ${{ env.MATHA_VERSION }}: Release"
          git push origin ${{ env.MATHA_VERSION }}

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ env.MATHA_VERSION }} \
            --title "Matha ${{ env.MATHA_VERSION }}" \
            --notes-file docs/RELEASE_NOTES_v4.3.md

      - name: 验证 Release
        run: |
          gh release view ${{ env.MATHA_VERSION }}

  # ============================================================
  # 4. 发布 VS Code 插件
  # ============================================================
  publish-vscode:
    name: 发布 VS Code 插件
    runs-on: ubuntu-latest
    needs: [build-and-test, quality-check]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: extensions/vscode-matha/package-lock.json

      - name: 安装依赖
        working-directory: extensions/vscode-matha
        run: npm install

      - name: 编译 TypeScript
        working-directory: extensions/vscode-matha
        run: npm run compile

      - name: 打包 VSIX
        working-directory: extensions/vscode-matha
        run: npx vsce package --no-yarn

      - name: 发布到 VS Marketplace
        working-directory: extensions/vscode-matha
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --pat $VSCE_PAT --no-yarn

      - name: 发布到 Open VSX
        working-directory: extensions/vscode-matha
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish matha-*.vsix --pat $OVSX_PAT

  # ============================================================
  # 5. 通知
  # ============================================================
  notify:
    name: 发送通知
    runs-on: ubuntu-latest
    needs: [create-release, publish-vscode]
    if: always()

    steps:
      - name: 钉钉通知
        if: env.DINGTALK_WEBHOOK != ''
        run: |
          bash .github/configs/dingtalk_templates.sh ${{ job.status }}
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          MATHA_ENV: ${{ env.MATHA_ENV }}
          MATHA_DRY_RUN: ${{ env.MATHA_DRY_RUN }}

      - name: 更新状态
        run: |
          echo "Matha ${{ env.MATHA_VERSION }} 发布完成"
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/${{ env.MATHA_VERSION }}"
