# DORMANT(ci-hygiene): 本文件此前被 GitHub 整体拒绝（Actions 列表显示名回退为
# 文件路径、jobs=0、历史连续 failure）：多环境 matrix 写在工作流顶层的
# `strategy:`（该键只能存在于 job 下），且 workflow 级 env 引用了只存在于
# job 级的 matrix 上下文。现已把 strategy/env 下放到各 job、并修正
# needs 里带连字符的 job id 引用。
# 仍休眠的原因：步骤引用的 tests/stress_test_10khz.py、tests/test_hal_perf.py、
# tests/test_hal_multiprocessing.py 均不在仓库中（已用 git ls-files 核实），
# 每日 cron 只会制造无意义红报。改为仅手动触发。
# 阶段 25e 去外部凭据：钉钉通知（外部 webhook/secret 凭据无法获得）
# 删除，改为 GitHub Step Summary——零 secrets 面。
name: HAL Stress Test

on:
  workflow_dispatch:  # 仅允许手动触发（已移除 push.branches 与每日 schedule）

env:
  MATHA_WORKERS: 4  # 默认 4 Worker（根据实际 CPU 核数自动调整）

jobs:
  # 多环境矩阵（必须挂在 job 上，不能放在工作流顶层）
  stress-test:
    name: HAL 10kHz 压力测试 (${{ matrix.env }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        env: [dev, staging]
        os: [ubuntu-latest]
    env:
      MATHA_ENV: ${{ matrix.env }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || true

      - name: 运行单元测试
        run: |
          python -m unittest tests.test_intent_decomposer tests.test_hardware_hal tests.test_language_adapters -v

      - name: 运行 10kHz 压力测试
        run: |
          python tests/stress_test_10khz.py --frequency 10000 --duration 5 --channels 4

      - name: 运行 Multiprocessing 压力测试（${{ env.MATHA_WORKERS }} Worker）
        run: |
          python tests/test_hal_multiprocessing.py --workers ${{ env.MATHA_WORKERS }} --iterations 3000

      - name: 运行 pytest 性能测试
        run: |
          pip install pytest -q
          python -m pytest tests/test_hal_perf.py -v --benchmark

      - name: 运行突发写入测试
        run: |
          python tests/stress_test_10khz.py --burst --burst-count 10000

      - name: 运行跑马灯 Demo
        run: |
          python demos/multi_led_breathing.py --mode chase --speed 0.1

      - name: 运行同步呼吸灯 Demo
        run: |
          python demos/multi_led_breathing.py --mode sync --duration 2

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-test-results-${{ matrix.env }}
          path: |
            *.log
            tests/test_*.xml
          retention-days: 30

      # ============================================================
      # 运行摘要（零 secrets 面：写入 $GITHUB_STEP_SUMMARY）
      # ============================================================
      - name: 写运行摘要
        if: always()
        run: |
          {
            echo "### HAL 压力测试（${{ matrix.env }}）"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 结果 | ${{ job.status }} |"
            echo "| 提交 | ${{ github.sha }} |"
            echo ""
            echo "[运行详情](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> "$GITHUB_STEP_SUMMARY"

  regression-test:
    name: 回归测试 (${{ matrix.env }})
    runs-on: ${{ matrix.os }}
    needs: stress-test
    if: always()
    strategy:
      fail-fast: false
      matrix:
        env: [dev, staging]
        os: [ubuntu-latest]
    env:
      MATHA_ENV: ${{ matrix.env }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行全量回归测试
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      # ============================================================
      # 运行摘要（零 secrets 面：写入 $GITHUB_STEP_SUMMARY）
      # ============================================================
      - name: 写运行摘要
        if: always()
        run: |
          {
            echo "### 回归测试（${{ matrix.env }}）"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 结果 | ${{ job.status }} |"
            echo ""
            echo "[运行详情](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================
  # 性能告警检测
  # ============================================================
  performance-alert:
    name: 性能告警检测
    runs-on: ubuntu-latest
    needs: stress-test
    if: always() && needs['stress-test'].result == 'success'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行性能基准测试
        id: benchmark
        run: |
          pip install pytest -q
          python -m pytest tests/test_hal_perf.py::TestBenchmark -v --benchmark
          echo "baseline=$(python -c "import sys; sys.path.insert(0, '.'); from tests.test_hal_perf import *; import time; ops=SystemUnderTest().ops; t=time.perf_counter(); [ops.写入('gpio_18', True) for _ in range(10000)]; print(int(10000/(time.perf_counter()-t)))")" >> $GITHUB_OUTPUT

      - name: 写运行摘要 - 性能告警
        if: steps.benchmark.outputs.baseline < 100000
        run: |
          {
            echo "### HAL 性能告警"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 当前吞吐 | ${{ steps.benchmark.outputs.baseline }} ops/sec |"
            echo "| 基线吞吐 | 100000 ops/sec |"
            echo ""
            echo "[运行详情](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> "$GITHUB_STEP_SUMMARY"
