# ── 核心依赖（无外部依赖，纯 stdlib）─────────────────────────────────────────
# matha-auth 核心模块仅使用 Python 标准库，无第三方依赖。
# hashlib, hmac, base64, json, uuid, os, time, dataclasses, logging 均为 stdlib。

